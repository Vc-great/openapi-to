name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Build
        run: pnpm build --concurrency=1

  typecheck:
    name: Typecheck
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Build
        run: pnpm build --concurrency=1
      - name: Package typecheck
        run: pnpm typecheck --concurrency=1
      - name: Project-reference typecheck
        run: pnpm exec tsc -b

  tests:
    name: Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test:vitest

  lint-changed:
    name: Lint changed files
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/setup
      - name: Test lint collector
        run: pnpm test:release-scripts
      - name: Lint pull request files
        if: github.event_name == 'pull_request'
        run: pnpm lint:changed --base "${{ github.event.pull_request.base.sha }}"
      - name: Lint pushed files
        if: github.event_name == 'push'
        run: pnpm lint:changed --base "${{ github.event.before }}"

  release-smoke:
    name: Package and install smoke
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Build
        run: pnpm build
      - name: Verify repository contracts
        run: pnpm verify:repository-contract
      - name: Verify package surface
        run: pnpm verify:package-surface
      - name: Pack and install packages
        run: pnpm release:smoke
      - name: Verify Changesets development state
        run: pnpm verify:changeset-state:development
