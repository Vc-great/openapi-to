name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2'

jobs:
  common:
    name: CLI CommonJS E2E (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Build
        run: pnpm run build
      - name: Run deterministic CommonJS CLI E2E
        run: pnpm test:e2e:common
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          CLI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/cli-common
      - name: Upload CommonJS CLI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-common-${{ matrix.os }}
          path: ${{ runner.temp }}/cli-common
          if-no-files-found: warn
          retention-days: 14

  module:
    name: CLI ESM E2E (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Build
        run: pnpm run build
      - name: Run deterministic ESM CLI E2E
        run: pnpm test:e2e:module
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          CLI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/cli-module
      - name: Upload ESM CLI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-module-${{ matrix.os }}
          path: ${{ runner.temp }}/cli-module
          if-no-files-found: warn
          retention-days: 14

  remote:
    name: CLI local HTTP E2E (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Build
        run: pnpm run build
      - name: Generate from controlled local HTTP fixtures
        run: pnpm test:e2e:remote
        env:
          CLI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/cli-remote
      - name: Upload remote CLI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-remote-${{ matrix.os }}
          path: ${{ runner.temp }}/cli-remote
          if-no-files-found: warn
          retention-days: 14

  mcp-stdio-e2e:
    name: MCP stdio E2E
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Test built-bin stdio and controlled-write protocol
        run: pnpm test:mcp:stdio
      - name: Run MCP Doctor
        run: pnpm mcp:check -- --json --output "${{ runner.temp }}/mcp-doctor.json"
      - name: Upload sanitized MCP Doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-doctor-node20
          path: ${{ runner.temp }}/mcp-doctor.json
          if-no-files-found: error
          retention-days: 14

  mcp-cross-platform:
    name: MCP cross-platform smoke (${{ matrix.os }})
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node 20 and pnpm
        uses: ./.github/setup
      - name: Initialize, list tools, validate, and close
        run: pnpm test:mcp:smoke
        env:
          MCP_TEST_ARTIFACT_DIR: ${{ runner.temp }}/mcp-smoke
      - name: Upload MCP smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/mcp-smoke
          if-no-files-found: warn
          retention-days: 14

  mcp-transaction-safety:
    name: MCP transaction safety
    if: github.event_name != 'schedule'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Test rollback, recovery, cancellation, and locks
        run: pnpm test:mcp:recovery

  mcp-performance:
    name: MCP performance and bounded stress
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup
        uses: ./.github/setup
      - name: Run benchmark regression and bounded stress
        run: pnpm test:mcp:performance
